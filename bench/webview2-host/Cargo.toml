[package]
name = "cgw-webview2-host"
description = "Spikes S5, S6, S9: a WebView2 window on any URL, for Playwright to drive over CDP"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The versions Tauri 2.12 already builds.
tao = "=0.37.2"
wry = "=0.57.2"
# Phase 19's print spike: WebView2's own PrintToPdf (the versions wry 0.57 builds).
webview2-com = "=0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation"] }
