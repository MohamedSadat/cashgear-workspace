packages:
  - apps/*
  - packages/*
  - bench/editor
onlyBuiltDependencies:
  - esbuild
# The CashGear component library is a git dependency: pnpm builds its dist/ on install.
allowBuilds:
  # Azurite's telemetry dependency; its install script is not needed.
  protobufjs: false
  '@cashgear/ui@https://codeload.github.com/MohamedSadat/CashGear.React.UI/tar.gz/bffe0909828863b549634abb3ce8fe18d4a059dd': true
patchedDependencies:
  '@tiptap/y-tiptap@3.3.0': patches/@tiptap__y-tiptap@3.3.0.patch
