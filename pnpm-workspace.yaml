packages:
  - apps/*
  - packages/*
  - bench/editor
onlyBuiltDependencies:
  - esbuild
# The CashGear component library is a git dependency: pnpm builds its dist/ on install.
allowBuilds:
  # Azurite's telemetry dependency; its install script is not needed.
  protobufjs: false
  '@cashgear/ui@https://codeload.github.com/MohamedSadat/CashGear.React.UI/tar.gz/5e70441770f4c1b7ca613d1634977aa06f7e0a9d': true
patchedDependencies:
  '@tiptap/y-tiptap@3.3.0': patches/@tiptap__y-tiptap@3.3.0.patch
