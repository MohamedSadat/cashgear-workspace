[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri", "bench/webview2-host"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "LicenseRef-CashGear-Proprietary"
publish = false
rust-version = "1.99.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# cgw-ydoc's C library catches panics at its boundary, which needs unwinding; the desktop app
# keeps `abort`. Build it with `cargo build -p cgw-ydoc --profile ffi`.
[profile.ffi]
inherits = "release"
panic = "unwind"
