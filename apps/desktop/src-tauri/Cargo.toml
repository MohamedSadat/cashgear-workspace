[package]
name = "cgw-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The same minor as @tauri-apps/api and @tauri-apps/cli, which the Tauri CLI checks.
tauri = { version = "~2.12", features = [] }
tauri-plugin-dialog = "2"
# Opens links in the system browser (WorkspacePlatform.openExternal).
tauri-plugin-opener = "2"
cgw-store = { path = "../../../crates/cgw-store" }
cgw-native = { path = "../../../crates/cgw-native" }
serde = { version = "1", features = ["derive"] }
# cashgear-workspace:// links (crates/cgw-native reads them); the installer registers the scheme.
tauri-plugin-deep-link = "2"
# One app per data folder; a second start hands its deep link to the first.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# The OS certificate store (SChannel on Windows) rather than a bundled one, as Sheet does: the
# default rustls brings webpki-root-certs, whose CDLA-Permissive-2.0 the licence gate refuses.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
# generate_context! embeds the plugins' settings as JSON.
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
