[package]
name = "cgw-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The same minor as @tauri-apps/api and @tauri-apps/cli, which the Tauri CLI checks.
tauri = { version = "~2.12", features = [] }
tauri-plugin-dialog = "2"
# Opens links in the system browser (WorkspacePlatform.openExternal).
tauri-plugin-opener = "2"
cgw-store = { path = "../../../crates/cgw-store" }
# generate_context! embeds the plugins' settings as JSON.
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
