[package]
name = "cgw-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The same minor as @tauri-apps/api and @tauri-apps/cli, which the Tauri CLI checks.
tauri = { version = "~2.12", features = [] }
tauri-plugin-dialog = "2"
# Opens links in the system browser (WorkspacePlatform.openExternal).
tauri-plugin-opener = "2"
cgw-store = { path = "../../../crates/cgw-store" }
cgw-native = { path = "../../../crates/cgw-native" }
serde = { version = "1", features = ["derive"] }
# cashgear-workspace:// links (crates/cgw-native reads them); the installer registers the scheme.
tauri-plugin-deep-link = "2"
# One app per data folder; a second start hands its deep link to the first.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# The OS certificate store (SChannel on Windows) rather than a bundled one, as Sheet does: the
# default rustls brings webpki-root-certs, whose CDLA-Permissive-2.0 the licence gate refuses.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
# generate_context! embeds the plugins' settings as JSON.
serde_json = "1"

# Phase 19: printing the print view (src/print.rs). Windows: WebView2's own PrintToPdf, at the
# versions Tauri 2.12's wry builds. macOS: AppKit's NSPrintOperation of the WKWebView.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSGeometry", "NSObject", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation", "NSWindow", "NSResponder", "NSView", "objc2-core-foundation"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "objc2-app-kit"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# The test-only bridge (src/bridge.rs) the macOS acceptance run drives the app through. Test builds
# only, never a release: build.rs refuses it when CGW_RELEASE_BUILD is set, and
# scripts/macos-verify.mjs checks that the release binary has none of it.
e2e-bridge = []
