name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  # The Phase 1 and Phase 2 budget gates compare with the last run on main's uploaded results.
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: Licence gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: pnpm install --frozen-lockfile
      - name: cargo-deny (licences and sources)
        run: pnpm deny
      - name: cargo-deny (advisories, informational)
        run: cargo deny check advisories
        continue-on-error: true
      - name: No credential in the repository
        run: pnpm secrets:check
      - run: pnpm licenses:check
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: NuGet licences (the server's packages)
        run: dotnet restore server/Cgw.Server.slnx && pnpm licenses:nuget
      - name: GPL dependencies fail every gate
        run: pnpm licenses:selftest

  server:
    name: Server (.NET, SQL Server with full-text, Azurite)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: pnpm install --frozen-lockfile
      # A fresh password per run, never in the repo or the logs.
      - name: SQL Server 2022 with full-text search
        run: |
          password="$(openssl rand -base64 24 | tr -d '/+=')Aa1!"
          echo "::add-mask::$password"
          echo "MSSQL_SA_PASSWORD=$password" >> "$GITHUB_ENV"
          docker build -t cgw-mssql-fts -f server/tests/sqlserver-fts.Dockerfile server/tests
          docker run -d --name mssql -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" cgw-mssql-fts
      # The worker's Yjs library (crates/cgw-ydoc over its C ABI).
      - run: cargo build -p cgw-ydoc --profile ffi
      - run: pnpm server:build
      - name: The OpenAPI document and the API client are committed as the build makes them
        run: git diff --exit-code server/openapi packages/api/src/schema.ts && pnpm api:check
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT FULLTEXTSERVICEPROPERTY('IsFullTextInstalled')" && break
            sleep 2
          done
      - name: Server tests (SQL Server in a container, Azurite)
        run: pnpm server:test
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
          CGW_TEST_FULLTEXT: required
      - name: The last run on main's Phase 2 server figures
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow CI --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run" ]; then
            gh run download "$run" --name phase2-server --dir bench/previous-run
            for name in phase2.json phase4.json phase10.json phase11.json phase13.json phase14.json phase15.json; do
              found=$(find bench/previous-run -name "$name" | head -n 1)
              if [ -n "$found" ]; then mkdir -p bench/previous && cp "$found" "bench/previous/$name"; fi
            done
          fi
      # Phase 2's server budgets (bench/phase2.mjs): push, pull, feed, search on the full-text path,
      # compaction and the 200-user load test, in Release, gated against the last run on main.
      - name: Phase 2 server budgets and load test
        run: pnpm bench:phase2 -- --server
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
          CGW_TEST_FULLTEXT: required
      # Phase 4's server budget (bench/phase4.mjs --server, Phase4Bench): the query over 50,000 rows
      # with one filter and one sort, p95, through the API on SQL Server.
      - name: Phase 4 server budget (the query at 50,000 rows)
        run: pnpm bench:phase4 -- --server
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
      # Phase 10's server budget (bench/phase10.mjs --server, Phase10Bench): retrieval by meaning
      # over 100,000 chunks in one workspace, warm and after a change, less the provider's time.
      - name: Phase 10 server budget (retrieval by meaning over 100,000 chunks)
        run: pnpm bench:phase10 -- --server
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
      # Phase 11's server budgets (bench/phase11.mjs, Phase11Bench): search on the full-text path and
      # the feed of 1,000 changes at 10,000 pages for a member in 20 groups, the tree tracked; a
      # sign-in by passkey and one through single sign-on (the mock provider), the API's own time.
      - name: Phase 11 server budgets (groups at 10,000 pages, passkey and single sign-on sign-ins)
        run: pnpm bench:phase11
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
          CGW_TEST_FULLTEXT: required
      # Phase 13's server budget (bench/phase13.mjs --server, Phase13Bench): retrieval by meaning over
      # 1,000,000 chunks in one workspace through the approximate index, warm and after a change, less
      # the provider's time, and its recall of the exact search's first ten pages. The local model's
      # budget is taken on the host's processor (bench/phase13.mjs --local-model), not here.
      - name: Phase 13 server budget (retrieval by meaning over 1,000,000 chunks)
        run: pnpm bench:phase13 -- --server
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
      # Phase 14's server budget (bench/phase14.mjs --server, Phase14Bench): a site's or share link's
      # check of a file in a database of 50,000 rows holding 100,000 files, by the index of rows'
      # files; a file no row holds, and 0.13.0's scan of the rows' values, tracked beside it.
      - name: Phase 14 server budget (a file check at 50,000 rows)
        run: pnpm bench:phase14 -- --server
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
      # Phase 15's server budget (bench/phase15.mjs --server, Phase15Bench): date triggers over a
      # database of 50,000 rows found within a pass of the worker, after a row changed; the first pass
      # and passes with nothing changed tracked.
      - name: Phase 15 server budget (date triggers at 50,000 rows)
        run: pnpm bench:phase15 -- --server
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-server
          path: |
            bench/results/
            !bench/results/phase2-corpus/

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The S3 harness calls cgw-ydoc from .NET 10 by P/Invoke.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Ensure WebView2 Runtime
        run: ./scripts/setup-webview2.ps1
      - run: pnpm install --frozen-lockfile
      - run: pnpm rust:fmt
      # Tauri embeds apps/web/dist, so the web build comes before clippy.
      - run: pnpm build
      # Phase 11: the app built against the API on localhost, for the passkey specs (WebAuthn takes
      # no IP address as its relying party); Playwright serves it on localhost:4268.
      - run: node scripts/web-localhost.mjs --build
      # The released web builds (target/old-build/<tag>, each from its tag and its own lockfile)
      # that tests/e2e/old-build.spec.ts serves beside this build: v0.2.0 (Phase 3), v0.3.0
      # (Phase 4: a page with a database, and rows it must never see), v0.4.0 (Phase 5: a page
      # with a workbook and ERP data, schema 4), v0.5.0 (Phase 6: a schema-5 page naming a
      # person, and the feed's comments and notifications), v0.6.0 (Phase 7: a schema-6 page
      # with plugin blocks), v0.7.0 and v0.8.0 (Phase 9: a timeline view, a type neither
      # knows, drawn as a table there and kept a timeline with its settings), and v0.9.0
      # (Phase 10: a third-party plugin block, a placeholder there and kept as it is), v0.10.0
      # (Phase 11: a page whose access holds a group's row, kept by its save), v0.14.0 (Phase 15:
      # a database with rules and a button, both kept while it edits rows), and v0.15.0 (Phase 16:
      # a form view, drawn as a table there and kept a form with its settings).
      - name: The old builds (v0.2.0's to v0.15.0's web apps)
        run: |
          git fetch --tags --force
          node scripts/old-build.mjs
      - run: pnpm rust:clippy
      - run: pnpm rust:test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # The SQLite store's conformance suite runs through this binary.
      - run: cargo build -p cgw-store --bin cgw-store-cli
      - run: pnpm test
      # Phase 2's specs run against the server stack (scripts/server-stack.mjs): SQL Server LocalDB,
      # the worker's Yjs library, Azurite (a dev dependency) and the server, built there.
      - name: SQL Server LocalDB for the server stack
        shell: pwsh
        run: |
          $tool = Get-Command sqllocaldb -ErrorAction SilentlyContinue
          if (-not $tool) {
            $found = Get-ChildItem 'C:\Program Files\Microsoft SQL Server' -Recurse -Filter SqlLocalDB.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) {
              choco install sqllocaldb -y --no-progress
              $found = Get-ChildItem 'C:\Program Files\Microsoft SQL Server' -Recurse -Filter SqlLocalDB.exe | Select-Object -First 1
            }
            $tool = $found.FullName
            Add-Content $env:GITHUB_PATH (Split-Path $tool)
          } else { $tool = $tool.Source }
          & $tool create MSSQLLocalDB -s
          & $tool info MSSQLLocalDB
      - run: cargo build -p cgw-ydoc --profile ffi
      # Browser tests use the runner's installed Chrome and Edge. Phase 5's specs also start the
      # mock Sheet and the mock ERP (tests/mocks, Playwright's webServer, fresh on CI). Phase 6's
      # (realtime.spec.ts, comments.spec.ts) recycle the stack's API through its control port
      # (scripts/server-stack.mjs --e2e, 127.0.0.1:5289).
      - run: pnpm test:e2e
      # Kill the app while typing, reopen, check nothing reported saved was lost (25 runs each;
      # 1,000 locally for the exit criterion).
      # In Chrome the kill is taskkill over the whole tree, as in Phase 1: ending only the browser
      # process at once sometimes loses a whole session's IndexedDB writes in Chrome itself
      # (scripts/kill-test.mjs, --kill); the desktop's kill is the immediate one.
      - name: Kill test (Chrome, IndexedDB)
        timeout-minutes: 20
        run: node scripts/kill-test.mjs --target web --runs 25 --kill tree
      - run: pnpm --filter @cgw/desktop build
      - run: pnpm desktop:smoke
      # The exit criteria's specs again, on the built desktop app over CDP.
      - run: pnpm test:e2e:desktop
      - name: Kill test (desktop, SQLite)
        timeout-minutes: 20
        run: node scripts/kill-test.mjs --target desktop --runs 25
      # Phase 3 (M3.5): kills during a store migration (the v1 and v2 fixtures; 10 runs, many
      # locally), then kills during sync on both targets against one server stack started here
      # and kept for the benchmarks below (25 runs each; 1,000 locally for the exit criterion).
      - name: Kill test during a store migration (desktop, the v1 and v2 fixtures)
        timeout-minutes: 20
        run: node scripts/kill-migration.mjs --runs 10
      - name: Server stack for the Phase 3 runs and the benchmarks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bench/results | Out-Null
          Start-Process -FilePath node -ArgumentList 'scripts/server-stack.mjs','--e2e' -RedirectStandardOutput bench/results/server-stack.log -RedirectStandardError bench/results/server-stack.err.log -WindowStyle Hidden
          for ($i = 0; $i -lt 300; $i++) {
            try { if ((Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:5280/health/live).StatusCode -eq 200) { exit 0 } } catch { }
            Start-Sleep -Seconds 2
          }
          Get-Content bench/results/server-stack.log -Tail 50
          exit 1
      - name: Kill test during sync (Chrome, IndexedDB, signed in)
        timeout-minutes: 20
        run: node scripts/kill-test.mjs --target web --sync --runs 25 --check-every 10 --kill tree
      - name: Kill test during sync (desktop, SQLite, signed in)
        timeout-minutes: 20
        run: node scripts/kill-test.mjs --target desktop --sync --runs 25 --check-every 10
      # Phase 0's harnesses, kept (bench/README.md). pnpm test above already ran the S1 fuzz,
      # the S1 scenarios, the S2 gate and the Yjs pending test; cargo test ran S7's server side.
      - name: S3 – cgw-ydoc against Yjs 13, from .NET
        run: pnpm bench:s3
        env:
          S3_DOCS: 300
          S3_BIG_BYTES: 262144
      - name: S5 and S7 – RTL checklist and hostile content (Chrome)
        run: pnpm bench:browser -- --s5 --s7 --chrome
      - name: S6 – editor budgets on the editor alone (Chrome); editor work feeds the gate below
        run: pnpm bench:browser -- --s6 --chrome
      - name: The last run on main's budget figures
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list --workflow CI --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if ($run) {
            gh run download $run --name phase-verification --dir bench/previous-run
            foreach ($name in 'phase1.json', 'phase2.json', 'phase3.json', 'phase4.json', 'phase5.json', 'phase6.json', 'phase7.json', 'phase8.json', 'phase9.json', 'phase10.json', 'phase12.json', 'phase13.json', 'phase14.json', 'phase15.json', 'phase16.json') {
              $found = Get-ChildItem bench/previous-run -Recurse -Filter $name | Select-Object -First 1
              if ($found) { New-Item -ItemType Directory -Force bench/previous | Out-Null; Copy-Item $found.FullName "bench/previous/$name" }
            }
          }
      # Phase 2's first sync (bench/phase2.mjs): a 1,000-page workspace into a fresh Chrome
      # context's IndexedDB, against the server stack it starts, after the e2e specs.
      - name: Phase 2 first sync, gated against the budget and the last run on main
        run: pnpm bench:phase2 -- --first-sync
      - name: Phase 1 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase1 -- --desktop
      # Phase 3's (bench/phase3.mjs): reconnect with 1,000 waiting updates, pinning a 500-page
      # subtree while typing, the store for 1,000 cached pages, and the desktop's cold start with
      # no server answering; against the server stack started above.
      - name: Phase 3 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase3 -- --desktop
      # Phase 4's (bench/phase4.mjs): a 50,000-row database imported through the server's route,
      # its first rows, the table's scroll, a board drag and a cell edit in Chrome (IndexedDB), and
      # a cell edit on the desktop app (SQLite); against the server stack started above. The
      # server's query budget runs in the server job.
      - name: Phase 4 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase4 -- --desktop --no-server
      # Phase 5's (bench/phase5.mjs): an embed's first paint of a 1,000-cell range scrolled into
      # view, typing between ten live embeds, an ERP block's first page less the ERP's own time;
      # in Chrome and on the desktop app, against the server stack started above and the mocks it
      # starts.
      - name: Phase 5 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase5 -- --desktop
      # Phase 6's (bench/phase6.mjs): 20 editors on one page over the real hub (the server's relay
      # p95 from its metrics route, which the e2e stack maps), the keystroke budget in Chrome and on
      # the desktop app while 19 of them type, and 2,000 connections on the one API process (memory
      # and CPU idle and with presence, against sanity caps) and their reconnect storm after the
      # API is recycled through the stack's control port; against the server stack started above.
      - name: Phase 6 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase6 -- --desktop
      # Phase 7's (bench/phase7.mjs): the review of 500 changed ERP records less the ERP's dry
      # run, and the first AI token less the provider's own time, in Chrome against the server
      # stack above, the mock ERP and the mock provider it starts.
      - name: Phase 7 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase7
      # Phase 8's (bench/phase8.mjs): a paste of 1,000 cells into a synced table (shown, and on
      # the server) and a 1,000-page Notion export imported on the device, in Chrome against the
      # server stack above. The server's CPU per push against 0.7.0 is measured on the reference
      # machine (bench/phase8-server.mjs), as it needs 0.7.0 built beside this build.
      - name: Phase 8 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase8
      # Phase 9's (bench/phase9.mjs): a published page of 2,000 blocks read from the Sites process
      # (localhost:5290) over HTTP, fresh and from its cache, and a timeline over 50,000 rows in
      # Chrome (its first bars and a drag), against the server stack above.
      - name: Phase 9 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase9
      # Phase 10's (bench/phase10.mjs --no-server): the review of 500 changed customers less the
      # ERP's dry run, and typing between ten third-party plugin frames, in Chrome against the
      # server stack above (its plugins host on localhost:5291) and the mocks. The server's
      # retrieval by meaning runs in the server job.
      - name: Phase 10 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase10 -- --no-server
      # Phase 12's (bench/phase12.mjs): a chart view of 50,000 rows by count (its first bars), and
      # pinning a 5,000-row database whose rows all have documents while typing on another page
      # (until every document is on the device, and the keystroke budget meanwhile), in Chrome
      # against the server stack above. The ERP's first page of a 100,000-record connector is
      # Track E10's own measure, taken in the ERP's repository.
      - name: Phase 12 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase12
      # Phase 13's (bench/phase13.mjs --no-server): typing between ten networked plugin frames, each
      # reaching the mock host it was allowed (tests/mocks/net/server.mjs), in Chrome against the
      # server stack above. The server's retrieval at 1,000,000 chunks runs in the server job.
      - name: Phase 13 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase13 -- --no-server
      # Phase 14's (bench/phase14.mjs --no-server): a published page of 2,000 blocks at its own host
      # name (a `*.localhost` name proven in the DNS stand-in, its certificate from the mock ACME
      # server), read over HTTP from the Sites process's cache, against the server stack above. The
      # server's file check at 50,000 rows runs in the server job.
      - name: Phase 14 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase14 -- --no-server
      # Phase 15's (bench/phase15.mjs --no-server): a rule's first step after the change that starts
      # it, shown in an open tab, and a paste of 1,000 cells starting a rule in each row (every run
      # done, typing on another page meanwhile), in Chrome against the server stack above. The
      # server's date triggers at 50,000 rows run in the server job; the processor time per push with
      # ten rules is bench/phase8-server.mjs's, taken locally.
      - name: Phase 15 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase15 -- --no-server
      # Phase 16's (bench/phase16.mjs): a form link's page, first byte from the Sites process's
      # cache; an answer by the link to its row in an open tab; and 50 answers a second across five
      # links for a minute (the answer route's time, typing on another page meanwhile); in Chrome
      # against the server stack above.
      - name: Phase 16 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-verification
          path: |
            bench/results/
            !bench/results/phase3-corpus/
            playwright-report/
            playwright-report-desktop/
            test-results/
            test-results-desktop/
