name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  # The Phase 1 and Phase 2 budget gates compare with the last run on main's uploaded results.
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: Licence gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: pnpm install --frozen-lockfile
      - name: cargo-deny (licences and sources)
        run: pnpm deny
      - name: cargo-deny (advisories, informational)
        run: cargo deny check advisories
        continue-on-error: true
      - name: No credential in the repository
        run: pnpm secrets:check
      - run: pnpm licenses:check
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: NuGet licences (the server's packages)
        run: dotnet restore server/Cgw.Server.slnx && pnpm licenses:nuget
      - name: GPL dependencies fail every gate
        run: pnpm licenses:selftest

  server:
    name: Server (.NET, SQL Server with full-text, Azurite)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: pnpm install --frozen-lockfile
      # A fresh password per run, never in the repo or the logs.
      - name: SQL Server 2022 with full-text search
        run: |
          password="$(openssl rand -base64 24 | tr -d '/+=')Aa1!"
          echo "::add-mask::$password"
          echo "MSSQL_SA_PASSWORD=$password" >> "$GITHUB_ENV"
          docker build -t cgw-mssql-fts -f server/tests/sqlserver-fts.Dockerfile server/tests
          docker run -d --name mssql -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" cgw-mssql-fts
      # The worker's Yjs library (crates/cgw-ydoc over its C ABI).
      - run: cargo build -p cgw-ydoc --profile ffi
      - run: pnpm server:build
      - name: The OpenAPI document and the API client are committed as the build makes them
        run: git diff --exit-code server/openapi packages/api/src/schema.ts && pnpm api:check
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT FULLTEXTSERVICEPROPERTY('IsFullTextInstalled')" && break
            sleep 2
          done
      - name: Server tests (SQL Server in a container, Azurite)
        run: pnpm server:test
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
          CGW_TEST_FULLTEXT: required
      - name: The last run on main's Phase 2 server figures
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow CI --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run" ]; then
            gh run download "$run" --name phase2-server --dir bench/previous-run
            found=$(find bench/previous-run -name phase2.json | head -n 1)
            if [ -n "$found" ]; then mkdir -p bench/previous && cp "$found" bench/previous/phase2.json; fi
          fi
      # Phase 2's server budgets (bench/phase2.mjs): push, pull, feed, search on the full-text path,
      # compaction and the 200-user load test, in Release, gated against the last run on main.
      - name: Phase 2 server budgets and load test
        run: pnpm bench:phase2 -- --server
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
          CGW_TEST_FULLTEXT: required
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-server
          path: |
            bench/results/
            !bench/results/phase2-corpus/

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The S3 harness calls cgw-ydoc from .NET 10 by P/Invoke.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Ensure WebView2 Runtime
        run: ./scripts/setup-webview2.ps1
      - run: pnpm install --frozen-lockfile
      - run: pnpm rust:fmt
      # Tauri embeds apps/web/dist, so the web build comes before clippy.
      - run: pnpm build
      - run: pnpm rust:clippy
      - run: pnpm rust:test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # The SQLite store's conformance suite runs through this binary.
      - run: cargo build -p cgw-store --bin cgw-store-cli
      - run: pnpm test
      # Phase 2's specs run against the server stack (scripts/server-stack.mjs): SQL Server LocalDB,
      # the worker's Yjs library, Azurite (a dev dependency) and the server, built there.
      - name: SQL Server LocalDB for the server stack
        shell: pwsh
        run: |
          $tool = Get-Command sqllocaldb -ErrorAction SilentlyContinue
          if (-not $tool) {
            $found = Get-ChildItem 'C:\Program Files\Microsoft SQL Server' -Recurse -Filter SqlLocalDB.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $found) {
              choco install sqllocaldb -y --no-progress
              $found = Get-ChildItem 'C:\Program Files\Microsoft SQL Server' -Recurse -Filter SqlLocalDB.exe | Select-Object -First 1
            }
            $tool = $found.FullName
            Add-Content $env:GITHUB_PATH (Split-Path $tool)
          } else { $tool = $tool.Source }
          & $tool create MSSQLLocalDB -s
          & $tool info MSSQLLocalDB
      - run: cargo build -p cgw-ydoc --profile ffi
      # Browser tests use the runner's installed Chrome and Edge.
      - run: pnpm test:e2e
      # Kill the app while typing, reopen, check nothing reported saved was lost (25 runs each;
      # 1,000 locally for the exit criterion).
      - name: Kill test (Chrome, IndexedDB)
        run: node scripts/kill-test.mjs --target web --runs 25
      - run: pnpm --filter @cgw/desktop build
      - run: pnpm desktop:smoke
      # The exit criteria's specs again, on the built desktop app over CDP.
      - run: pnpm test:e2e:desktop
      - name: Kill test (desktop, SQLite)
        run: node scripts/kill-test.mjs --target desktop --runs 25
      # Phase 0's harnesses, kept (bench/README.md). pnpm test above already ran the S1 fuzz,
      # the S1 scenarios, the S2 gate and the Yjs pending test; cargo test ran S7's server side.
      - name: S3 – cgw-ydoc against Yjs 13, from .NET
        run: pnpm bench:s3
        env:
          S3_DOCS: 300
          S3_BIG_BYTES: 262144
      - name: S5 and S7 – RTL checklist and hostile content (Chrome)
        run: pnpm bench:browser -- --s5 --s7 --chrome
      - name: S6 – editor budgets on the editor alone (Chrome); editor work feeds the gate below
        run: pnpm bench:browser -- --s6 --chrome
      - name: The last run on main's budget figures
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list --workflow CI --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if ($run) {
            gh run download $run --name phase-verification --dir bench/previous-run
            foreach ($name in 'phase1.json', 'phase2.json') {
              $found = Get-ChildItem bench/previous-run -Recurse -Filter $name | Select-Object -First 1
              if ($found) { New-Item -ItemType Directory -Force bench/previous | Out-Null; Copy-Item $found.FullName "bench/previous/$name" }
            }
          }
      # Phase 2's first sync (bench/phase2.mjs): a 1,000-page workspace into a fresh Chrome
      # context's IndexedDB, against the server stack it starts, after the e2e specs.
      - name: Phase 2 first sync, gated against the budget and the last run on main
        run: pnpm bench:phase2 -- --first-sync
      - name: Phase 1 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase1 -- --desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-verification
          path: |
            bench/results/
            playwright-report/
            playwright-report-desktop/
            test-results/
            test-results-desktop/
