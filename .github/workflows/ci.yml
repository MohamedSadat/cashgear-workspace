name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: Licence gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: pnpm install --frozen-lockfile
      - name: cargo-deny (licences and sources)
        run: pnpm deny
      - name: cargo-deny (advisories, informational)
        run: cargo deny check advisories
        continue-on-error: true
      - run: pnpm licenses:check
      - name: GPL dependencies fail both gates
        run: pnpm licenses:selftest

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Ensure WebView2 Runtime
        run: ./scripts/setup-webview2.ps1
      - run: pnpm install --frozen-lockfile
      - run: pnpm rust:fmt
      # Tauri embeds apps/web/dist, so the web build comes before clippy.
      - run: pnpm build
      - run: pnpm rust:clippy
      - run: pnpm rust:test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # Browser tests use the runner's installed Chrome and Edge.
      - run: pnpm test:e2e
      - run: pnpm --filter @cgw/desktop build
      - run: pnpm desktop:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-verification
          path: |
            bench/results/
            playwright-report/
            test-results/
