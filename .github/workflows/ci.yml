name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  # The Phase 1 budget gate compares with the last run on main's uploaded results.
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: Licence gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: pnpm install --frozen-lockfile
      - name: cargo-deny (licences and sources)
        run: pnpm deny
      - name: cargo-deny (advisories, informational)
        run: cargo deny check advisories
        continue-on-error: true
      - run: pnpm licenses:check
      - name: GPL dependencies fail both gates
        run: pnpm licenses:selftest

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # The S3 harness calls cgw-ydoc from .NET 10 by P/Invoke.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Ensure WebView2 Runtime
        run: ./scripts/setup-webview2.ps1
      - run: pnpm install --frozen-lockfile
      - run: pnpm rust:fmt
      # Tauri embeds apps/web/dist, so the web build comes before clippy.
      - run: pnpm build
      - run: pnpm rust:clippy
      - run: pnpm rust:test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # The SQLite store's conformance suite runs through this binary.
      - run: cargo build -p cgw-store --bin cgw-store-cli
      - run: pnpm test
      # Browser tests use the runner's installed Chrome and Edge.
      - run: pnpm test:e2e
      # Kill the app while typing, reopen, check nothing reported saved was lost (25 runs each;
      # 1,000 locally for the exit criterion).
      - name: Kill test (Chrome, IndexedDB)
        run: node scripts/kill-test.mjs --target web --runs 25
      - run: pnpm --filter @cgw/desktop build
      - run: pnpm desktop:smoke
      # The exit criteria's specs again, on the built desktop app over CDP.
      - run: pnpm test:e2e:desktop
      - name: Kill test (desktop, SQLite)
        run: node scripts/kill-test.mjs --target desktop --runs 25
      # Phase 0's harnesses, kept (bench/README.md). pnpm test above already ran the S1 fuzz,
      # the S1 scenarios, the S2 gate and the Yjs pending test; cargo test ran S7's server side.
      - name: S3 – cgw-ydoc against Yjs 13, from .NET
        run: pnpm bench:s3
        env:
          S3_DOCS: 300
          S3_BIG_BYTES: 262144
      - name: S5 and S7 – RTL checklist and hostile content (Chrome)
        run: pnpm bench:browser -- --s5 --s7 --chrome
      - name: S6 – editor budgets on the editor alone (Chrome); editor work feeds the gate below
        run: pnpm bench:browser -- --s6 --chrome
      - name: The last run on main's budget figures
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list --workflow CI --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if ($run) {
            gh run download $run --name phase-verification --dir bench/previous-run
            $found = Get-ChildItem bench/previous-run -Recurse -Filter phase1.json | Select-Object -First 1
            if ($found) { New-Item -ItemType Directory -Force bench/previous | Out-Null; Copy-Item $found.FullName bench/previous/phase1.json }
          }
      - name: Phase 1 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase1 -- --desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-verification
          path: |
            bench/results/
            playwright-report/
            playwright-report-desktop/
            test-results/
            test-results-desktop/
