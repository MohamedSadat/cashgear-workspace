name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  # The Phase 1 and Phase 2 budget gates compare with the last run on main's uploaded results.
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: Licence gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: pnpm install --frozen-lockfile
      - name: cargo-deny (licences and sources)
        run: pnpm deny
      - name: cargo-deny (advisories, informational)
        run: cargo deny check advisories
        continue-on-error: true
      - name: No credential in the repository
        run: pnpm secrets:check
      - run: pnpm licenses:check
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: NuGet licences (the server's packages)
        run: dotnet restore server/Cgw.Server.slnx && pnpm licenses:nuget
      - name: GPL dependencies fail every gate
        run: pnpm licenses:selftest

  server:
    name: Server (.NET, SQL Server with full-text, Azurite)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: pnpm install --frozen-lockfile
      # A fresh password per run, never in the repo or the logs.
      - name: SQL Server 2022 with full-text search
        run: |
          password="$(openssl rand -base64 24 | tr -d '/+=')Aa1!"
          echo "::add-mask::$password"
          echo "MSSQL_SA_PASSWORD=$password" >> "$GITHUB_ENV"
          docker build -t cgw-mssql-fts -f server/tests/sqlserver-fts.Dockerfile server/tests
          docker run -d --name mssql -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" cgw-mssql-fts
      # The worker's Yjs library (crates/cgw-ydoc over its C ABI).
      - run: cargo build -p cgw-ydoc --profile ffi
      - run: pnpm server:build
      - name: The OpenAPI document and the API client are committed as the build makes them
        run: git diff --exit-code server/openapi packages/api/src/schema.ts && pnpm api:check
      - name: Wait for SQL Server
        run: |
          for i in $(seq 1 60); do
            docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT FULLTEXTSERVICEPROPERTY('IsFullTextInstalled')" && break
            sleep 2
          done
      - name: Server tests (SQL Server in a container, Azurite)
        run: pnpm server:test
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
          CGW_TEST_FULLTEXT: required
      - name: The last run on main's Phase 2 server figures
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(gh run list --workflow CI --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run" ]; then
            gh run download "$run" --name phase2-server --dir bench/previous-run
            for name in phase2.json phase4.json phase10.json phase11.json phase13.json phase14.json phase15.json phase17.json; do
              found=$(find bench/previous-run -name "$name" | head -n 1)
              if [ -n "$found" ]; then mkdir -p bench/previous && cp "$found" "bench/previous/$name"; fi
            done
          fi
      # Phase 2's server budgets (bench/phase2.mjs): push, pull, feed, search on the full-text path,
      # compaction and the 200-user load test, in Release, gated against the last run on main.
      - name: Phase 2 server budgets and load test
        run: pnpm bench:phase2 -- --server
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
          CGW_TEST_FULLTEXT: required
      # Phase 4's server budget (bench/phase4.mjs --server, Phase4Bench): the query over 50,000 rows
      # with one filter and one sort, p95, through the API on SQL Server.
      - name: Phase 4 server budget (the query at 50,000 rows)
        run: pnpm bench:phase4 -- --server
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
      # Phase 10's server budget (bench/phase10.mjs --server, Phase10Bench): retrieval by meaning
      # over 100,000 chunks in one workspace, warm and after a change, less the provider's time.
      - name: Phase 10 server budget (retrieval by meaning over 100,000 chunks)
        run: pnpm bench:phase10 -- --server
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
      # Phase 11's server budgets (bench/phase11.mjs, Phase11Bench): search on the full-text path and
      # the feed of 1,000 changes at 10,000 pages for a member in 20 groups, the tree tracked; a
      # sign-in by passkey and one through single sign-on (the mock provider), the API's own time.
      - name: Phase 11 server budgets (groups at 10,000 pages, passkey and single sign-on sign-ins)
        run: pnpm bench:phase11
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
          CGW_TEST_FULLTEXT: required
      # Phase 13's server budget (bench/phase13.mjs --server, Phase13Bench): retrieval by meaning over
      # 1,000,000 chunks in one workspace through the approximate index, warm and after a change, less
      # the provider's time, and its recall of the exact search's first ten pages. The local model's
      # budget is taken on the host's processor (bench/phase13.mjs --local-model), not here.
      - name: Phase 13 server budget (retrieval by meaning over 1,000,000 chunks)
        run: pnpm bench:phase13 -- --server
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
      # Phase 14's server budget (bench/phase14.mjs --server, Phase14Bench): a site's or share link's
      # check of a file in a database of 50,000 rows holding 100,000 files, by the index of rows'
      # files; a file no row holds, and 0.13.0's scan of the rows' values, tracked beside it.
      - name: Phase 14 server budget (a file check at 50,000 rows)
        run: pnpm bench:phase14 -- --server
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
      # Phase 15's server budget (bench/phase15.mjs --server, Phase15Bench): date triggers over a
      # database of 50,000 rows found within a pass of the worker, after a row changed; the first pass
      # and passes with nothing changed tracked.
      - name: Phase 15 server budget (date triggers at 50,000 rows)
        run: pnpm bench:phase15 -- --server
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
      # Phase 17's server budgets (bench/phase17.mjs --server, Phase17Bench): with 10,000 runs
      # waiting, a pass finding those due; 10,000 reminders due in a minute, each one's lag to the
      # inbox; the tree's first page of a 50,000-row table with 10,000 parents.
      - name: Phase 17 server budgets (waits, reminders, sub-items)
        run: pnpm bench:phase17 -- --server
        env:
          CGW_TEST_SQL: Server=localhost,1433;User ID=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=true;Encrypt=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2-server
          path: |
            bench/results/
            !bench/results/phase2-corpus/

  # Until 0.19.0 everything below was one Windows job of about 150 minutes. It is now four kinds of
  # job side by side, each on a runner of its own that builds what it needs itself (a web build
  # takes under a minute, the server about two), so no job waits on another: the checks; the
  # browser e2e as three shards each of Chrome and Edge, each then a share of the budgets of
  # Phases 7 to 19; the old builds' spec, then Phases 9 and 19; and the kill tests with the budgets
  # of Phases 1 to 6.
  # The budgets of Phases 7 to 19 run after the specs, 11 minutes and more into a runner: in a job
  # of their own, the server's bulk writes in a runner's first 6 to 9 minutes ran slow and uneven
  # (a 50,000-row import past 30 s, 14 s answers), failing three of five runs (PROGRESS.md, After
  # 0.19.0). The desktop app is not built or tested here from 2026-11-26 (the web app first,
  # DECISIONS.md): the release workflow still builds it on a version tag.
  checks:
    name: Checks and unit tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust-components: rustfmt, clippy
          rust-cache-key: windows
      - run: pnpm rust:fmt
      # Tauri embeds apps/web/dist, so the web build comes before clippy.
      - run: pnpm build
      - run: pnpm rust:clippy
      - run: pnpm rust:test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # The SQLite store's conformance suite runs through this binary.
      - run: cargo build -p cgw-store --bin cgw-store-cli
      - run: pnpm test
      # Phase 0's harnesses, kept (bench/README.md). pnpm test above already ran the S1 fuzz,
      # the S1 scenarios, the S2 gate and the Yjs pending test; cargo test ran S7's server side.
      # S6 feeds Phase 1's gate, so it runs in that job.
      - name: S3 – cgw-ydoc against Yjs 13, from .NET
        run: pnpm bench:s3
        env:
          S3_DOCS: 300
          S3_BIG_BYTES: 262144
      - name: S5 and S7 – RTL checklist and hostile content (Chrome)
        run: pnpm bench:browser -- --s5 --s7 --chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: bench/results/

  # Playwright's own shards are by count of tests, file by file within a browser, so Chrome and Edge
  # are sharded apart: each shard is a third of one browser's files with its own e2e server stack
  # and mocks (Playwright's webServer, fresh on CI). Browser tests use the runner's installed Chrome
  # and Edge. Phase 5's specs start the mock Sheet and the mock ERP; Phase 6's (realtime.spec.ts,
  # comments.spec.ts) recycle the stack's API through its control port (127.0.0.1:5289). Then each
  # shard runs the budgets its `include` names (`pN`), the longest shards (about 19 minutes) the
  # fewest, every bench with its own server stack, gated against the budgets and, on the same
  # processor, the last green run on main's figures; each shard's go in its own artifact.
  e2e:
    name: Browser e2e (${{ matrix.project }}, ${{ matrix.shard }} of 3) and budgets ${{ matrix.phases }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [chrome, edge]
        shard: [1, 2, 3]
        include:
          - project: chrome
            shard: 1
            phases: 8, 18
            p8: true
            p18: true
          - project: chrome
            shard: 2
            phases: 12, 17, 13
            p12: true
            p17: true
            p13: true
          - project: chrome
            shard: 3
            phases: 14
            p14: true
          - project: edge
            shard: 1
            phases: 7
            p7: true
          - project: edge
            shard: 2
            phases: 16, 10
            p16: true
            p10: true
          - project: edge
            shard: 3
            phases: 15
            p15: true
    env:
      # The old builds' spec runs in its own job, beside the builds it needs.
      CGW_E2E_WITHOUT_OLD_BUILDS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust-cache-key: ffi
      - uses: ./.github/actions/server-stack
      - run: pnpm build
      # Phase 11: the app built against the API on localhost, for the passkey specs (WebAuthn takes
      # no IP address as its relying party); Playwright serves it on localhost:4268.
      - run: node scripts/web-localhost.mjs --build
      - run: pnpm test:e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}/3
      - name: The last run on main's budget figures
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list --workflow CI --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if ($run) {
            gh run download $run --pattern 'phase-verification*' --dir bench/previous-run
            foreach ($name in 'phase1.json', 'phase2.json', 'phase3.json', 'phase4.json', 'phase5.json', 'phase6.json', 'phase7.json', 'phase8.json', 'phase9.json', 'phase10.json', 'phase12.json', 'phase13.json', 'phase14.json', 'phase15.json', 'phase16.json', 'phase17.json', 'phase18.json', 'phase19.json') {
              $found = Get-ChildItem bench/previous-run -Recurse -Filter $name | Select-Object -First 1
              if ($found) { New-Item -ItemType Directory -Force bench/previous | Out-Null; Copy-Item $found.FullName "bench/previous/$name" }
            }
          }
      # Phase 7's (bench/phase7.mjs): the review of 500 changed ERP records less the ERP's dry
      # run, and the first AI token less the provider's own time, in Chrome against a server stack,
      # the mock ERP and the mock provider it starts.
      - name: Phase 7 budgets, gated against the budgets and the last run on main
        if: matrix.p7
        run: pnpm bench:phase7
      # Phase 8's (bench/phase8.mjs): a paste of 1,000 cells into a synced table (shown, and on
      # the server) and a 1,000-page Notion export imported on the device, in Chrome against a
      # server stack it starts. The server's CPU per push against 0.7.0 is measured on the reference
      # machine (bench/phase8-server.mjs), as it needs 0.7.0 built beside this build.
      - name: Phase 8 budgets, gated against the budgets and the last run on main
        if: matrix.p8
        run: pnpm bench:phase8
      # Phase 10's (bench/phase10.mjs --no-server): the review of 500 changed customers less the
      # ERP's dry run, and typing between ten third-party plugin frames, in Chrome against a
      # server stack it starts (its plugins host on localhost:5291) and the mocks. The server's
      # retrieval by meaning runs in the server job.
      - name: Phase 10 budgets, gated against the budgets and the last run on main
        if: matrix.p10
        run: pnpm bench:phase10 -- --no-server
      # Phase 12's (bench/phase12.mjs): a chart view of 50,000 rows by count (its first bars), and
      # pinning a 5,000-row database whose rows all have documents while typing on another page
      # (until every document is on the device, and the keystroke budget meanwhile), in Chrome
      # against a server stack it starts. The ERP's first page of a 100,000-record connector is
      # Track E10's own measure, taken in the ERP's repository.
      - name: Phase 12 budgets, gated against the budgets and the last run on main
        if: matrix.p12
        run: pnpm bench:phase12
      # Phase 13's (bench/phase13.mjs --no-server): typing between ten networked plugin frames, each
      # reaching the mock host it was allowed (tests/mocks/net/server.mjs), in Chrome against a
      # server stack it starts. The server's retrieval at 1,000,000 chunks runs in the server job.
      - name: Phase 13 budgets, gated against the budgets and the last run on main
        if: matrix.p13
        run: pnpm bench:phase13 -- --no-server
      # Phase 14's (bench/phase14.mjs --no-server): a published page of 2,000 blocks at its own host
      # name (a `*.localhost` name proven in the DNS stand-in, its certificate from the mock ACME
      # server), read over HTTP from the Sites process's cache, against a server stack it starts. The
      # server's file check at 50,000 rows runs in the server job.
      - name: Phase 14 budgets, gated against the budgets and the last run on main
        if: matrix.p14
        run: pnpm bench:phase14 -- --no-server
      # Phase 15's (bench/phase15.mjs --no-server): a rule's first step after the change that starts
      # it, shown in an open tab, and a paste of 1,000 cells starting a rule in each row (every run
      # done, typing on another page meanwhile), in Chrome against a server stack it starts. The
      # server's date triggers at 50,000 rows run in the server job; the processor time per push with
      # ten rules is bench/phase8-server.mjs's, taken locally.
      - name: Phase 15 budgets, gated against the budgets and the last run on main
        if: matrix.p15
        run: pnpm bench:phase15 -- --no-server
      # Phase 16's (bench/phase16.mjs): a form link's page, first byte from the Sites process's
      # cache; an answer by the link to its row in an open tab; and 50 answers a second across five
      # links for a minute (the answer route's time, typing on another page meanwhile); in Chrome
      # against a server stack it starts.
      - name: Phase 16 budgets, gated against the budgets and the last run on main
        if: matrix.p16
        run: pnpm bench:phase16
      # Phase 17's (bench/phase17.mjs --no-server): the first rows of a 50,000-row table with 10,000
      # parents nesting their sub-items, and a 50,000-row timeline with 10,000 dependencies (first
      # bars and a drag), in Chrome against a server stack it starts (relations seeded by sqlcmd).
      - name: Phase 17 budgets, gated against the budgets and the last run on main
        if: matrix.p17
        run: pnpm bench:phase17 -- --no-server
      # Phase 18's (bench/phase18.mjs): a paid checkout's webhooks to the workspace's allowance shown,
      # against a server stack it starts and the mock Paddle (started if not running). The local
      # completion model's budget needs the real package and is run by hand (--local-model).
      - name: Phase 18 budgets, gated against the budgets and the last run on main
        if: matrix.p18
        run: pnpm bench:phase18
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-verification-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            bench/results/
            !bench/results/phase3-corpus/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            bench/results/
            playwright-report/
            test-results/

  # The released web builds (target/old-build/<tag>, each from its tag and its own lockfile) that
  # tests/e2e/old-build.spec.ts serves beside this build: v0.2.0 (Phase 3), v0.3.0 (Phase 4: a page
  # with a database, and rows it must never see), v0.4.0 (Phase 5: a page with a workbook and ERP
  # data, schema 4), v0.5.0 (Phase 6: a schema-5 page naming a person, and the feed's comments and
  # notifications), v0.6.0 (Phase 7: a schema-6 page with plugin blocks), v0.7.0 and v0.8.0
  # (Phase 9: a timeline view, a type neither knows, drawn as a table there and kept a timeline
  # with its settings), v0.9.0 (Phase 10: a third-party plugin block, a placeholder there and kept
  # as it is), v0.10.0 (Phase 11: a page whose access holds a group's row, kept by its save),
  # v0.14.0 (Phase 15: a database with rules and a button, both kept while it edits rows), v0.15.0
  # (Phase 16: a form view, drawn as a table there and kept a form with its settings), v0.16.0
  # (Phase 17: rules that wait and ask, a unique id and roles, kept), v0.17.0 (Phase 18: an answer
  # of the server's own model read to its end, and a paid plan's allowance) and v0.18.0 (Phase 19:
  # a page's layout, kept by its edits). A build that fails fails its step, so the spec never skips
  # one here. Then the budgets of Phases 9 and 19, as the e2e shards run theirs.
  old-builds:
    name: Browser e2e, the old builds (Chrome and Edge), and budgets 9, 19
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust-cache-key: ffi
      - uses: ./.github/actions/server-stack
      - run: pnpm build
      - run: node scripts/web-localhost.mjs --build
      - name: The old builds (v0.2.0's to v0.18.0's web apps)
        run: |
          git fetch --tags --force
          node scripts/old-build.mjs
      - run: pnpm test:e2e tests/e2e/old-build.spec.ts
      - name: The last run on main's budget figures
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list --workflow CI --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if ($run) {
            gh run download $run --pattern 'phase-verification*' --dir bench/previous-run
            foreach ($name in 'phase1.json', 'phase2.json', 'phase3.json', 'phase4.json', 'phase5.json', 'phase6.json', 'phase7.json', 'phase8.json', 'phase9.json', 'phase10.json', 'phase12.json', 'phase13.json', 'phase14.json', 'phase15.json', 'phase16.json', 'phase17.json', 'phase18.json', 'phase19.json') {
              $found = Get-ChildItem bench/previous-run -Recurse -Filter $name | Select-Object -First 1
              if ($found) { New-Item -ItemType Directory -Force bench/previous | Out-Null; Copy-Item $found.FullName "bench/previous/$name" }
            }
          }
      # Phase 9's (bench/phase9.mjs): a published page of 2,000 blocks read from the Sites process
      # (localhost:5290) over HTTP, fresh and from its cache, and a timeline over 50,000 rows in
      # Chrome (its first bars and a drag), against a server stack it starts.
      - name: Phase 9 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase9
      # Phase 19's (bench/phase19.mjs): a page of 2,000 blocks, 20 pictures and a database block of
      # 1,000 rows on the device, to a Word file (typing on another page meanwhile) and to its print
      # view laid out with the print dialog asked for; and, tracked, the whole print to "Save as
      # PDF" (Chrome headed with --kiosk-printing). No server.
      - name: Phase 19 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase19
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-verification-old-builds
          path: |
            bench/results/
            !bench/results/phase3-corpus/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-old-builds
          path: |
            bench/results/
            playwright-report/
            test-results/

  # The kill tests and the budgets of Phases 1 to 6, gated against the budgets and, on the same
  # processor, the last green run on main's figures (its phase-verification artifacts). Phase 1's
  # gate reads the Chrome kill test's figures and S6's (bench/results), so they run here first.
  budgets-early:
    name: Kill tests and budgets, Phases 1 to 6 (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust-cache-key: ffi
      - uses: ./.github/actions/server-stack
      - run: pnpm build
      # Kill the app while typing, reopen, check nothing reported saved was lost (25 runs; 1,000
      # locally for the exit criterion). The kill is taskkill over the whole tree, as in Phase 1:
      # ending only the browser process at once sometimes loses a whole session's IndexedDB writes
      # in Chrome itself (scripts/kill-test.mjs, --kill).
      - name: Kill test (Chrome, IndexedDB)
        timeout-minutes: 20
        run: node scripts/kill-test.mjs --target web --runs 25 --kill tree
      # Phase 3 (M3.5): kills during sync against one server stack started here and kept for the
      # benchmarks below (25 runs; 1,000 locally for the exit criterion).
      - name: Server stack for the benchmarks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bench/results | Out-Null
          Start-Process -FilePath node -ArgumentList 'scripts/server-stack.mjs','--e2e' -RedirectStandardOutput bench/results/server-stack.log -RedirectStandardError bench/results/server-stack.err.log -WindowStyle Hidden
          for ($i = 0; $i -lt 300; $i++) {
            try { if ((Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:5280/health/live).StatusCode -eq 200) { exit 0 } } catch { }
            Start-Sleep -Seconds 2
          }
          Get-Content bench/results/server-stack.log -Tail 50
          exit 1
      - name: Kill test during sync (Chrome, IndexedDB, signed in)
        timeout-minutes: 20
        run: node scripts/kill-test.mjs --target web --sync --runs 25 --check-every 10 --kill tree
      - name: S6 – editor budgets on the editor alone (Chrome); editor work feeds the gate below
        run: pnpm bench:browser -- --s6 --chrome
      # Both budget jobs' artifacts, phase-verification-early and -later (before 0.19.0's split,
      # one phase-verification): each figure's file is in one of them.
      - name: The last run on main's budget figures
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh run list --workflow CI --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if ($run) {
            gh run download $run --pattern 'phase-verification*' --dir bench/previous-run
            foreach ($name in 'phase1.json', 'phase2.json', 'phase3.json', 'phase4.json', 'phase5.json', 'phase6.json', 'phase7.json', 'phase8.json', 'phase9.json', 'phase10.json', 'phase12.json', 'phase13.json', 'phase14.json', 'phase15.json', 'phase16.json', 'phase17.json', 'phase18.json', 'phase19.json') {
              $found = Get-ChildItem bench/previous-run -Recurse -Filter $name | Select-Object -First 1
              if ($found) { New-Item -ItemType Directory -Force bench/previous | Out-Null; Copy-Item $found.FullName "bench/previous/$name" }
            }
          }
      # Phase 2's first sync (bench/phase2.mjs): a 1,000-page workspace into a fresh Chrome
      # context's IndexedDB, against the server stack above.
      - name: Phase 2 first sync, gated against the budget and the last run on main
        run: pnpm bench:phase2 -- --first-sync
      - name: Phase 1 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase1
      # Phase 3's (bench/phase3.mjs): reconnect with 1,000 waiting updates, pinning a 500-page
      # subtree while typing, and the store for 1,000 cached pages; against the server stack above.
      - name: Phase 3 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase3
      # Phase 4's (bench/phase4.mjs): a 50,000-row database imported through the server's route,
      # its first rows, the table's scroll, a board drag and a cell edit in Chrome (IndexedDB);
      # against the server stack above. The server's query budget runs in the server job.
      - name: Phase 4 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase4 -- --no-server
      # Phase 5's (bench/phase5.mjs): an embed's first paint of a 1,000-cell range scrolled into
      # view, typing between ten live embeds, an ERP block's first page less the ERP's own time;
      # in Chrome, against the server stack above and the mocks it starts.
      - name: Phase 5 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase5
      # Phase 6's (bench/phase6.mjs): 20 editors on one page over the real hub (the server's relay
      # p95 from its metrics route, which the e2e stack maps), the keystroke budget in Chrome while
      # 19 of them type, and 2,000 connections on the one API process (memory and CPU idle and with
      # presence, against sanity caps) and their reconnect storm after the API is recycled through
      # the stack's control port; against the server stack above.
      - name: Phase 6 budgets, gated against the budgets and the last run on main
        run: pnpm bench:phase6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-verification-early
          path: |
            bench/results/
            !bench/results/phase3-corpus/
